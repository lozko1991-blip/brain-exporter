name: 🧠 Brain → XML Export

on:
  schedule:
    # QUICK (тільки ціни і наявність) — 3 рази на день за Києвом.
    # GitHub cron у UTC; Київ влітку = UTC+3, взимку = UTC+2.
    # Беремо UTC так, щоб приблизно потрапити на 09:00 / 15:00 / 21:00 Київ.
    - cron: '0 6,12,18 * * *'   # ≈ 09:00, 15:00, 21:00 Київ (літо)
    # FULL (товари + описи + фото) — раз на тиждень, неділя.
    - cron: '0 1 * * 0'         # ≈ 04:00 Київ неділя

  workflow_dispatch:
    inputs:
      mode:
        description: 'Режим вигрузки'
        required: true
        default: 'full'
        type: choice
        options:
          - full
          - quick
      lang:
        description: 'Мова товарів (база)'
        required: true
        default: 'ua'
        type: choice
        options:
          - ua
          - ru

# Визначаємо режим автоматично залежно від того, який cron спрацював
jobs:
  export:
    name: Вигрузка Brain → XML
    runs-on: ubuntu-latest
    timeout-minutes: 180
    permissions:
      contents: write

    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: 🐍 Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 📦 Залежності
        run: pip install httpx

      - name: 🧭 Визначити режим
        id: pick
        run: |
          # Неділя о 01:00 UTC → full; решта schedule → quick;
          # ручний запуск → беремо input.
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "mode=${{ github.event.inputs.mode }}" >> "$GITHUB_OUTPUT"
            echo "lang=${{ github.event.inputs.lang }}" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event.schedule }}" = "0 1 * * 0" ]; then
            echo "mode=full"  >> "$GITHUB_OUTPUT"
            echo "lang=ua"    >> "$GITHUB_OUTPUT"
          else
            echo "mode=quick" >> "$GITHUB_OUTPUT"
            echo "lang=ua"    >> "$GITHUB_OUTPUT"
          fi

      - name: 🚀 Вигрузка XML
        env:
          BRAIN_LOGIN:    ${{ secrets.BRAIN_LOGIN }}
          BRAIN_PASSWORD: ${{ secrets.BRAIN_PASSWORD }}
          EXPORT_MODE:    ${{ steps.pick.outputs.mode }}
          LANG:           ${{ steps.pick.outputs.lang }}
          SHOP_NAME:      "AVi"
          SHOP_URL:       "https://avi.com.ua"
        run: python export.py

      - name: 💾 Зберегти в репозиторій
        run: |
          git config user.name  "GitHub Actions Bot"
          git config user.email "actions@github.com"
          git fetch origin main
          git reset --soft origin/main
          git add -A output || true
          git add categories.json || true
          git add products_cache.json || true
          git diff --staged --quiet || git commit -m "🔄 Auto-update [$(date +'%Y-%m-%d %H:%M')] mode=${{ steps.pick.outputs.mode }}"
          git push origin main

      - name: 📤 Upload Artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: brain-catalog-${{ github.run_number }}
          path: output/*.xml
          retention-days: 30
