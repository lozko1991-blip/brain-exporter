name: 🧠 Brain → XML Export

# ─────────────────────────────────────────────────────────────────────
# Архітектура (стійка до збоїв/таймаутів Brain, до 40k товарів, ОДИН файл):
#   prepare → setup → shard×N (паралельно) → merge → GitHub Release
#
#   • setup  — один auth, спільний SID на всі shard-и (Brain бачить 1 сесію),
#              + categories.json (artifact).
#   • shard  — кожен качає СВОЮ частину категорій (свій кеш-artifact),
#              має TIME_BUDGET → при таймауті зберігає прогрес і виходить ОК.
#   • merge  — if: always() — збирає що є навіть якщо shard впав; будує ОДИН
#              kasta.xml; кладе кеш і XML у Release (до 2ГБ, не через git).
#   • quick  — 3×/день: лише ціни/наявність з кешу (швидко), окрема гілка.
#
# Великі файли (products_cache.json, output/*.xml) живуть у Release-асеті
# з постійним тегом `feed`, а НЕ в git (інакше push>100МБ падає, а репо
# роздувається від щоденних комітів).
#
# Публічна URL для KASTA — GitHub Pages (деплой через Actions):
#   https://АКАУНТ.github.io/РЕПО/kasta.xml
# Release-asset URL (releases/download/...) НЕ використовується у маркетплейсі:
# GitHub віддає його через 302-редирект на підписану URL, що протухає ~1 год,
# з Content-Type: application/octet-stream — імпортери кешують такий фід
# за URL і не бачать оновлень (саме це було з Kasta).
# ─────────────────────────────────────────────────────────────────────

on:
  schedule:
    - cron: '0 6,12,18 * * *'    # QUICK — ціни/наявність, 3×/день (~09/15/21 Київ)
    - cron: '0 1 1,11,21 * *'    # FULL  — повна вигрузка, 3×/місяць (1,11,21 ~04:00 Київ)

  workflow_dispatch:
    inputs:
      mode:
        description: 'Режим'
        required: true
        default: 'full'
        type: choice
        options: [full, quick]
      lang:
        description: 'Мова дерева категорій (текст товару завжди двомовний)'
        required: true
        default: 'ua'
        type: choice
        options: [ua, ru]
      shards:
        description: 'К-сть паралельних shard-джоб (FULL). 4 = баланс; 1 = без паралелі'
        required: true
        default: '4'
        type: choice
        options: ['1', '2', '4', '6']

env:
  RELEASE_TAG: feed
  SHOP_NAME: "AVi"
  SHOP_URL: "https://avi.com.ua"

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  # ════════════════════════════════════════════════════════════════
  prepare:
    name: 🧭 Визначити параметри
    runs-on: ubuntu-latest
    outputs:
      mode:   ${{ steps.p.outputs.mode }}
      lang:   ${{ steps.p.outputs.lang }}
      shards: ${{ steps.p.outputs.shards }}
      matrix: ${{ steps.p.outputs.matrix }}
    steps:
      - id: p
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            MODE="${{ github.event.inputs.mode }}"
            LANG="${{ github.event.inputs.lang }}"
            SHARDS="${{ github.event.inputs.shards }}"
          elif [ "${{ github.event.schedule }}" = "0 1 1,11,21 * *" ]; then
            MODE="full"; LANG="ua"; SHARDS="4"
          else
            MODE="quick"; LANG="ua"; SHARDS="1"
          fi
          # масив індексів shard-ів для matrix: 4 → [0,1,2,3]
          IDX=$(seq 0 $((SHARDS-1)) | paste -sd, -)
          echo "mode=$MODE"     >> "$GITHUB_OUTPUT"
          echo "lang=$LANG"     >> "$GITHUB_OUTPUT"
          echo "shards=$SHARDS" >> "$GITHUB_OUTPUT"
          echo "matrix={\"index\":[$IDX]}" >> "$GITHUB_OUTPUT"
          echo "→ mode=$MODE lang=$LANG shards=$SHARDS matrix=[$IDX]"

  # ════════════════════════════════════════════════════════════════
  #  QUICK — лише ціни/наявність з кешу (одна швидка джоба)
  # ════════════════════════════════════════════════════════════════
  quick:
    name: ⚡ Quick (ціни + наявність)
    needs: prepare
    if: needs.prepare.outputs.mode == 'quick'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
      pages: write
      id-token: write
    concurrency:
      group: pages-deploy
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - run: pip install httpx

      - name: ⬇️ Кеш із Release (resume base)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download "$RELEASE_TAG" -p products_cache.json -p categories.json --clobber || echo "Release ще немає — буде FULL fallback"
          gh release download "$RELEASE_TAG" -p gender_pins.json --clobber || echo "📌 gender_pins немає (перший запуск)"

      - name: 🚀 Quick export
        env:
          BRAIN_LOGIN:    ${{ secrets.BRAIN_LOGIN }}
          BRAIN_PASSWORD: ${{ secrets.BRAIN_PASSWORD }}
          EXPORT_MODE:  quick
          EXPORT_STAGE: solo
          TIME_BUDGET_MIN: "55"   # якщо кешу нема й буде FULL-fallback — встигнути зберегти до kill на 60хв
          LANG:         ${{ needs.prepare.outputs.lang }}
          SHOP_NAME:    ${{ env.SHOP_NAME }}
          SHOP_URL:     ${{ env.SHOP_URL }}
        run: python export.py

      - name: 📤 Публікація в Release + commit categories.json + gender_pins.json
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$RELEASE_TAG" > /dev/null 2>&1 || \
            gh release create "$RELEASE_TAG" --title "Latest feed" --notes "Авто-оновлення фідів"
          gh release upload "$RELEASE_TAG" output/*.xml products_cache.json categories.json --clobber
          [ -f gender_pins.json ] && gh release upload "$RELEASE_TAG" gender_pins.json --clobber || true
          git config user.name "GitHub Actions Bot"; git config user.email "actions@github.com"
          git add -f categories.json || true
          git add -f gender_pins.json || true
          git diff --staged --quiet || git commit -m "🔄 categories + gender_pins [$(date +'%Y-%m-%d %H:%M')] quick"
          git push || true

      - name: 🌐 Підготовка Pages artifact (фіди для KASTA)
        run: |
          if [ ! -f output/kasta.xml ] && [ ! -f output/kasta2.xml ]; then
            echo "❌ Немає жодного XML — Pages не оновлюється"; exit 1
          fi
          mkdir -p _pages
          for f in index.html feeds.json categories.json gender_pins.json; do
            [ -f "$f" ] && cp "$f" _pages/ || true
          done
          for f in output/kasta.xml output/kasta2.xml; do
            [ -f "$f" ] && cp "$f" _pages/ || true
          done
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _pages
      - name: 🌐 Деплой фідів на GitHub Pages
        uses: actions/deploy-pages@v4
        id: deployment

  # ════════════════════════════════════════════════════════════════
  #  FULL — setup → shard×N → merge
  # ════════════════════════════════════════════════════════════════
  setup:
    name: 🔐 Setup (auth + категорії)
    needs: prepare
    if: needs.prepare.outputs.mode == 'full'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      sid: ${{ steps.run.outputs.sid }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - run: pip install httpx

      - id: run
        name: 🧩 Auth + categories.json
        env:
          BRAIN_LOGIN:    ${{ secrets.BRAIN_LOGIN }}
          BRAIN_PASSWORD: ${{ secrets.BRAIN_PASSWORD }}
          EXPORT_STAGE: setup
          LANG:         ${{ needs.prepare.outputs.lang }}
          SHOP_NAME:    ${{ env.SHOP_NAME }}
          SHOP_URL:     ${{ env.SHOP_URL }}
        run: |
          python export.py
          echo "::add-mask::$(cat .brain_sid)"   # SID не має світитись у логах

      - uses: actions/upload-artifact@v4
        with: { name: cats, path: categories.json, retention-days: 1 }

  shard:
    name: 📦 Shard ${{ matrix.index }}
    needs: [prepare, setup]
    if: needs.prepare.outputs.mode == 'full'
    runs-on: ubuntu-latest
    timeout-minutes: 330   # запас під 6-год ліміт; TIME_BUDGET зупиняє раніше
    strategy:
      fail-fast: false     # збій одного shard-а НЕ валить інші
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - run: pip install httpx

      - uses: actions/download-artifact@v4
        with: { name: cats }

      - name: ⬇️ Попередній кеш із Release (resume)
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release download "$RELEASE_TAG" -p products_cache.json --clobber || echo "Release ще немає — повна вигрузка з нуля"

      - name: 🚀 Качання частини каталогу
        env:
          BRAIN_LOGIN:    ${{ secrets.BRAIN_LOGIN }}
          BRAIN_PASSWORD: ${{ secrets.BRAIN_PASSWORD }}
          BRAIN_SID:    ${{ needs.setup.outputs.sid }}
          EXPORT_MODE:  full
          EXPORT_STAGE: shard
          SHARD_INDEX:  ${{ matrix.index }}
          SHARD_TOTAL:  ${{ needs.prepare.outputs.shards }}
          TIME_BUDGET_MIN: "300"   # зупинитись і зберегти, не чекаючи kill на 330
          LANG:         ${{ needs.prepare.outputs.lang }}
          SHOP_NAME:    ${{ env.SHOP_NAME }}
          SHOP_URL:     ${{ env.SHOP_URL }}
        run: python export.py

      - uses: actions/upload-artifact@v4
        if: always()   # зберегти навіть частковий результат
        with:
          name: shard-${{ matrix.index }}
          path: products_cache.shard${{ matrix.index }}.json
          retention-days: 1

  merge:
    name: 🧬 Merge + Release
    needs: [prepare, setup, shard]
    if: needs.prepare.outputs.mode == 'full' && always()
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: write
      pages: write
      id-token: write
    concurrency:
      group: pages-deploy
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - run: pip install httpx

      - uses: actions/download-artifact@v4
        with: { name: cats }

      - name: ⬇️ Попередній кеш (база для незмінених зрізів)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download "$RELEASE_TAG" -p products_cache.json --clobber || echo "немає"
          gh release download "$RELEASE_TAG" -p gender_pins.json --clobber || echo "📌 gender_pins немає (перший запуск)"

      - name: ⬇️ Усі shard-кеші
        uses: actions/download-artifact@v4
        with:
          pattern: shard-*
          merge-multiple: true

      - name: 🧬 Збірка одного кешу + XML
        env:
          EXPORT_STAGE: merge
          SHARD_TOTAL:  ${{ needs.prepare.outputs.shards }}
          LANG:         ${{ needs.prepare.outputs.lang }}
          SHOP_NAME:    ${{ env.SHOP_NAME }}
          SHOP_URL:     ${{ env.SHOP_URL }}
        run: python export.py

      - name: 📤 Публікація в Release + commit categories.json + gender_pins.json
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$RELEASE_TAG" > /dev/null 2>&1 || \
            gh release create "$RELEASE_TAG" --title "Latest feed" --notes "Авто-оновлення фідів"
          gh release upload "$RELEASE_TAG" output/*.xml products_cache.json categories.json --clobber
          [ -f gender_pins.json ] && gh release upload "$RELEASE_TAG" gender_pins.json --clobber || true
          git config user.name "GitHub Actions Bot"; git config user.email "actions@github.com"
          git add -f categories.json || true
          git add -f gender_pins.json || true
          git diff --staged --quiet || git commit -m "🔄 categories + gender_pins [$(date +'%Y-%m-%d %H:%M')] full"
          git push || true

      - name: 🌐 Підготовка Pages artifact (фіди для KASTA)
        run: |
          if [ ! -f output/kasta.xml ] && [ ! -f output/kasta2.xml ]; then
            echo "❌ Немає жодного XML — Pages не оновлюється"; exit 1
          fi
          mkdir -p _pages
          for f in index.html feeds.json categories.json gender_pins.json; do
            [ -f "$f" ] && cp "$f" _pages/ || true
          done
          for f in output/kasta.xml output/kasta2.xml; do
            [ -f "$f" ] && cp "$f" _pages/ || true
          done
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _pages
      - name: 🌐 Деплой фідів на GitHub Pages
        uses: actions/deploy-pages@v4
        id: deployment

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: brain-catalog-${{ github.run_number }}
          path: output/*.xml
          retention-days: 30
